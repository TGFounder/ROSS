name: ci

on:
  pull_request:
  push:
    branches: [main, "candidate/**"]

permissions:
  contents: read

jobs:
  posix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 tests/validate_repo.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 evals/evaluate.py validate
      - run: sh tests/test_posix.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tests/validate_repo.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python evals/evaluate.py validate
      - shell: powershell
        run: .\tests\test_windows.ps1

  agent-skills-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: python3 scripts/package.py --version 1.1.0 --sha "$GITHUB_SHA" --output dist
      - run: unzip -q dist/ross-v1.1.0.zip -d /tmp/ross-standard
      - run: skills-ref validate /tmp/ross-standard/ross
